"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 5000

[package]
disabled = true

[character]
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 5000
format = '[$duration](bold yellow)'

[shell]
disabled = false
zsh_indicator = 'zsh '
bash_indicator = ' '
format = '[$indicator]($style)'
style = 'cyan bold'

[directory]
truncate_to_repo = true
truncation_length = 2
truncation_symbol = ''
style = 'white'

[git_branch]
symbol = '[ ](green)'
style = 'green'

[git_state]
disabled = true

[git_metrics]
disabled = false
ignore_submodules = true
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_status]
format = '([$all_status$ahead_behind]($style) )'

[hostname]
ssh_symbol = " "

# ── Language symbols (Nerd Font) ────────────────────────────────────
[c]
symbol = " "

[conda]
symbol = " "

[docker_context]
symbol = " "

[golang]
symbol = " "

[java]
symbol = " "

[lua]
symbol = " "

[nodejs]
symbol = " "

[python]
symbol = " "

[rust]
symbol = "󱘗 "

[zig]
symbol = " "

[custom.cpp]
detect_extensions = ['cpp']
symbol = " "
format = 'via $symbol($output) '
command = "g++ --version | head -n1 | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+' | head -n1"
