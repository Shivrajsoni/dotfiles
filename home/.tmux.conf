set -g mouse on

# Prefix: Ctrl-A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vi mode
setw -g mode-keys vi
bind -n M-Left  send-keys Escape "0"
bind -n M-Right send-keys Escape "$"

# Pane navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Splits (open in the current pane's directory, not $HOME)
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# Floating terminal
bind f popup -E -w 70% -h 70% -xC -yC $SHELL

# Reload config
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# Terminal & color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Indexing & quality-of-life
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -s escape-time 0

# Clipboard & passthrough
set -g set-clipboard on
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g set-titles on
setw -g aggressive-resize on

# ── Status bar (Catppuccin Mocha) ──────────────────────────────────
set -g status-position top
set -g status-justify centre
set -g status-style "bg=#1e1e2e,fg=#cad3f5"

set -g status-left "#{?client_prefix,#[fg=#1e1e2e,bg=#c6a0f6,bold] ⌨  ,#[fg=#89b4fa,bold] ⎊ tmux }"
set -g status-right "#[fg=#1e1e2e,bg=#f38ba8,bold] #S "

set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#f38ba8,bold] #I #W#{?window_zoomed_flag,  ,} "
set -g window-status-current-style "fg=#f38ba8,bold"
set -g window-status-bell-style "fg=#f38ba8,bold"

# ── Plugins ────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tushyagupta81/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # save/restore sessions (prefix+Ctrl-s / Ctrl-r)
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save every 15m + restore on tmux start

# tmux-resurrect / continuum: survive reboots automatically
set -g @resurrect-capture-pane-contents 'on'    # keep scrollback in restored panes
set -g @resurrect-strategy-nvim 'session'       # restore nvim sessions too
set -g @continuum-restore 'on'                  # auto-restore last env on server start

# tmux-sessionx
set -g @sessionx-bind 'o'
set -g @sessionx-prefix on
set -g @sessionx-x-path '~/programs/*'
set -g @sessionx-fzf-builtin-tmux 'off'
set -g @sessionx-filter-current 'false'
set -g @sessionx-window-mode 'off'
set -g @sessionx-tree-mode 'on'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '80%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-prompt " "
set -g @sessionx-pointer "▶ "
set -g @sessionx-ls-command 'eza --tree --color=always --icons=always -L=2'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-additional-options "--color pointer:9,spinner:92,marker:46"
set -g @sessionx-tmuxinator-mode 'off'
set -g @sessionx-fzf-marks-mode 'off'
set -g @sessionx-fzf-marks-file '~/dotfiles/fzf-marks'
set -g @sessionx-filtered-sessions 'scratch,popup'

# tmux-floax
set -g @floax-bind '-n C-Space'
set -g @floax-bind-menu 'P'
set -g @floax-width '85%'
set -g @floax-height '85%'
set -g @floax-border-color 'darkorange'
set -g @floax-text-color 'white'
set -g @floax-change-path 'true'
set -g @floax-session-name 'popup'
set -g @floax-status 'on'

run '~/.tmux/plugins/tpm/tpm'
